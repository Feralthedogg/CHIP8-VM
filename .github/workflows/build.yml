name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install the Windows cross compiler and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          python -m pip install -r tests/requirements.txt
      - name: Build and test the Windows executable
        run: make test PYTHON=python
      - name: Upload executable and ROM test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chip8-windows-and-test-results
          path: |
            chip8.exe
            tests/reports/
          if-no-files-found: error
